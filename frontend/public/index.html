<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0F19" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CruciDrive" />
    <style>
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        background-color: #0B0F19;
        overflow: hidden;
      }
      /* Sin esto #root mide 0 de alto y los paneles pegados abajo (bottom: 0) quedan fuera de pantalla. */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // En localhost no se registra: el service worker serviría el paquete viejo y ocultaría los cambios al desarrollar.
      var isLocal = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1;
      if ('serviceWorker' in navigator && !isLocal) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
