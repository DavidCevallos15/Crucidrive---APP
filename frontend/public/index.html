<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CruciDrive · Tricimotos en Crucita</title>
    <meta name="description" content="Pide tu tricimoto o envía encomiendas en Crucita sin esperar en la calle." />
    <!--
      Vista previa al compartir el enlace (WhatsApp, Facebook, Telegram, X).
      Sus rastreadores no ejecutan JavaScript: estas etiquetas tienen que estar en el HTML estático.
      La imagen va con URL absoluta, 1200x630 y pesa menos de 300 KB (WhatsApp descarta las pesadas).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CruciDrive" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:url" content="https://app.tricimoto.app/" />
    <meta property="og:title" content="CruciDrive · Tricimotos en Crucita" />
    <meta property="og:description" content="Pide tu tricimoto o envía encomiendas en Crucita sin esperar en la calle." />
    <meta property="og:image" content="https://app.tricimoto.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://app.tricimoto.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de CruciDrive: tricimotos en Crucita" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CruciDrive · Tricimotos en Crucita" />
    <meta name="twitter:description" content="Pide tu tricimoto o envía encomiendas en Crucita sin esperar en la calle." />
    <meta name="twitter:image" content="https://app.tricimoto.app/og-image.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFCF7" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CruciDrive" />
    <style>
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        background-color: #FFFCF7;
        color: #291B25;
        overflow: hidden;
      }
      /* Sin esto #root mide 0 de alto y los paneles pegados abajo (bottom: 0) quedan fuera de pantalla. */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      :focus-visible { outline: 2px solid #294A75; outline-offset: 3px; }
      ::selection { background: #7F1139; color: #fff; }
      input { caret-color: #294A75; }
      * { scrollbar-color: #74636D #FFFCF7; scrollbar-width: thin; }
    </style>
    <script>
      // En localhost no se registra: el service worker serviría el paquete viejo y ocultaría los cambios al desarrollar.
      var isLocal = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1;
      if ('serviceWorker' in navigator && !isLocal) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
