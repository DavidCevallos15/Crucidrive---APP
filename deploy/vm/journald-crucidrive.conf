# Retención del registro de la VM (paso 007, criterio 19; E3). instalar.sh lo copia a
# /etc/systemd/journald.conf.d/crucidrive.conf. journald es uno solo para toda la VM: estos límites
# valen también para Caddy y el sistema, que en esta VM son solo el soporte del backend.
[Journal]
# En disco, para que sobreviva a un reinicio de la VM.
Storage=persistent
# El registro de acceso se guarda 14 días y después se borra solo (E3).
MaxRetentionSec=14day
# Tope de espacio: el disco de la VM es pequeño.
SystemMaxUse=500M
